<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }
        
        header {
            background: #1a1a1a;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #888;
            font-size: 1rem;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .photo-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .photo-item:hover {
            transform: scale(1.05);
        }
        
        .photo-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <header>
        <h1>Photo Portfolio</h1>
        <p class="subtitle">Your photography showcased</p>
    </header>
    
    <main class="gallery">
        <div class="photo-item">
            <img src="https://via.placeholder.com/400x300?text=Photo+1" alt="Portfolio photo 1">
        </div>
        <div class="photo-item">
            <img src="https://via.placeholder.com/400x300?text=Photo+2" alt="Portfolio photo 2">
        </div>
        <div class="photo-item">
            <img src="https://via.placeholder.com/400x300?text=Photo+3" alt="Portfolio photo 3">
        </div>
        <div class="photo-item">
            <img src="https://via.placeholder.com/400x300?text=Photo+4" alt="Portfolio photo 4">
        </div>
        <div class="photo-item">
            <img src="https://via.placeholder.com/400x300?text=Photo+5" alt="Portfolio photo 5">
        </div>
        <div class="photo-item">
            <img src="https://via.placeholder.com/400x300?text=Photo+6" alt="Portfolio photo 6">
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 Your Name. All rights reserved.</p>
    </footer>
</body>
</html>
